<!DOCTYPE html>
<html lang="en">
<head>
    <title>Modern Hall Ticket</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --secondary: #06b6d4; --dark: #1f2933; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--primary), var(--secondary)); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); width: 800px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; color: black; border-radius: 10px; overflow: hidden; }
        td { padding: 15px; border: 1px solid #ddd; }
        .btn { background: #22c55e; border: none; padding: 10px 20px; color: white; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1 align="center">EXAMINATION HALL TICKET</h1>
        <table>
            <tr><td><b>Student Name</b></td><td>Mitesh Rane</td></tr>
            <tr><td><b>Roll Number</b></td><td>5024150</td></tr>
        </table>
        <div align="center"><button class="btn">Upload Photo</button></div>
    </div>
</body>
</html>
