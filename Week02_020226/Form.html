<!DOCTYPE html>
<html>
<head>
    <title>Modern Registration Form</title>
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); font-family: sans-serif; color: white; padding: 50px; }
        form { background: white; color: black; padding: 30px; border-radius: 12px; max-width: 600px; margin: auto; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn-row { text-align: center; }
        .btn-p { background: #4f46e5; color: white; border: none; padding: 10px 30px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <form>
        <label>Full Name</label><input type="text" placeholder="Enter full name">
        <label>Email</label><input type="email" placeholder="example@email.com">
        <div class="btn-row"><button class="btn-p">Register</button></div>
    </form>
</body>
</html>
