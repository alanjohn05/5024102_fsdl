<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Ticket with File Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background-color: #1a2a3a; color: white; padding: 15px; text-align: center; border-radius: 5px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .upload-section { background-color: #e7f3ff; border: 2px dashed #007bff; padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>EXAMINATION HALL TICKET</h2>
            <p>Academic Year 2025-26</p>
        </div>
        <table>
            <tr><td><b>Student Name</b></td><td>Rahul Sharma</td></tr>
            <tr><td><b>Roll Number</b></td><td>5024201</td></tr>
            <tr><td><b>Course</b></td><td>B.Tech – Computer Engineering</td></tr>
            <tr><td><b>Semester</b></td><td>IV</td></tr>
        </table>
        <div class="upload-section">
            <h3>Upload Photo</h3>
            <input type="file" id="imageInput" accept="image/*">
        </div>
    </div>
</body>
</html>
