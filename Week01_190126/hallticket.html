<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Ticket with File Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .upload-section { background-color: #e7f3ff; border: 2px dashed #007bff; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center; }
        .upload-section h3 { color: #0056b3; margin-bottom: 15px; }
        input[type="file"] { margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td { border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 align="center">EXAMINATION HALL TICKET</h2>
        <table>
            <tr><td><b>Student Name</b></td><td>Mitesh Rane</td></tr>
            <tr><td><b>Roll Number</b></td><td>5024150</td></tr>
            <tr><td><b>Course</b></td><td>B.Tech - Information Technology</td></tr>
            <tr><td><b>Semester</b></td><td>IV</td></tr>
        </table>
        <div class="upload-section">
            <h3>Upload Photo</h3>
            <input type="file" id="imageInput" accept="image/*">
            <button class="upload-button" id="uploadBtn" disabled>Save Photo</button>
        </div>
    </div>
    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        imageInput.addEventListener('change', function() {
            if (this.files.length > 0) uploadBtn.disabled = false;
        });
        uploadBtn.addEventListener('click', () => alert('Photo saved successfully!'));
    </script>
</body>
</html>
