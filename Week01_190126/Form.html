<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #111827; padding: 40px; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; width: 850px; }
        .header { text-align: center; background: #111827; color: white; padding: 15px; border-radius: 8px 8px 0 0; margin: -30px -30px 20px -30px; }
        .section-head { background: #1e1b4b; color: white; padding: 8px 15px; font-size: 14px; font-weight: bold; margin: 20px 0 10px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px; border: 1px solid #e5e7eb; font-size: 13px; color: #374151; }
        .label { background: #f9fafb; font-weight: bold; width: 20%; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box;
        }
        .footer { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn-reg { background: #1e1b4b; color: white; padding: 10px 30px; border-radius: 20px; border: none; cursor: pointer; }
        .btn-clr { background: #f3f4f6; color: #374151; padding: 10px 30px; border-radius: 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header"><h2>Student Registration Form</h2></div>
        <div class="section-head">Personal Information</div>
        <table>
            <tr>
                <td class="label">Full Name</td><td><input type="text" placeholder="Enter full name"></td>
                <td class="label">Date of Birth</td><td><input type="date"></td>
            </tr>
            <tr>
                <td class="label">Email Address</td><td><input type="email" placeholder="example@email.com"></td>
                <td class="label">Password</td><td><input type="password" placeholder="Min 8 characters"></td>
            </tr>
        </table>
        <div class="footer">
            <button class="btn-reg">Register</button>
            <button class="btn-clr">Clear Form</button>
        </div>
    </div>
</body>
</html>
